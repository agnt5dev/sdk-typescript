name: SDK TypeScript Release

# Runs only when a GitHub release is published. There is intentionally no
# manual trigger: cut a release (or prerelease) from the GitHub UI or `gh
# release create` and this workflow builds and publishes the matching version.
# Pull request validation lives in ci.yml.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and changelog
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NATIVE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")

          if [ "$NATIVE_VERSION" != "$PACKAGE_VERSION" ] || [ "$LOCK_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Root ($PACKAGE_VERSION), native ($NATIVE_VERSION), and lockfile ($LOCK_VERSION) versions must match" >&2
            exit 1
          fi
          for manifest in npm/*/package.json; do
            PLATFORM_VERSION=$(node -p "require('./${manifest}').version")
            if [ "$PLATFORM_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "$manifest version $PLATFORM_VERSION does not match $PACKAGE_VERSION" >&2
              exit 1
            fi
          done

          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "Release tag must be a stable or SemVer prerelease version: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#v}
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing ## [$RELEASE_VERSION]" >&2
            exit 1
          fi
          if printf '%s\n' "$PACKAGE_VERSION" | grep -q -- '-'; then
            if [ "$RELEASE_PRERELEASE" != true ]; then
              echo "Prerelease package $PACKAGE_VERSION requires a GitHub prerelease" >&2
              exit 1
            fi
          elif [ "$RELEASE_PRERELEASE" = true ]; then
            echo "Stable package $PACKAGE_VERSION cannot be published from a GitHub prerelease" >&2
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  verify-publish-manifest:
    name: Verify published package manifest
    needs: [validate-release, build-native-linux, build-native-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: ./

      - name: Move artifacts to platform packages
        run: npx napi artifacts -d .

      - name: Exercise NAPI publish manifest generation
        run: |
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
          npm run verify:publish-manifest

  build-native-linux:
    name: Linux Native (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            node-arch: x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            node-arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust toolchain
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
          fi
          rustup target add ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure build parallelism
        run: echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || echo 4)" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: .
        # The NAPI cross-toolchain itself uses platform-specific optional
        # packages. Keep them installed; the SDK platform packages resolve from
        # local optional file dependencies until NAPI rewrites them for publish.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build NAPI native module
        working-directory: .
        run: |
          npx napi build \
            --platform \
            --release \
            --use-napi-cross \
            --manifest-path native/Cargo.toml \
            --output-dir . \
            --target ${{ matrix.target }}

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-linux-${{ matrix.node-arch }}
          path: ./*.node
          if-no-files-found: error
          retention-days: 7

  verify-native-linux:
    name: Linux compatibility (${{ matrix.node-arch }}, glibc 2.31)
    needs: build-native-linux
    runs-on: ${{ matrix.runner }}
    container:
      image: node:20-bullseye-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-arch: x64
            runner: ubuntu-latest
            artifact: bindings-linux-x64
            binding: agnt5-sdk-native.linux-x64-gnu.node
          - node-arch: arm64
            runner: ubuntu-24.04-arm
            artifact: bindings-linux-arm64
            binding: agnt5-sdk-native.linux-arm64-gnu.node
    steps:
      - name: Download native binding
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ./binding

      - name: Load native binding
        env:
          BINDING: ${{ matrix.binding }}
        run: |
          ldd --version | head -1
          node -e 'require("./binding/" + process.env.BINDING)'

  build-native-macos:
    name: macOS Native (aarch64-apple-darwin)
    needs: validate-release
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust toolchain
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
          fi
          rustup target add aarch64-apple-darwin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure build parallelism
        run: echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build NAPI native module
        working-directory: .
        run: |
          npx napi build \
            --platform \
            --release \
            --manifest-path native/Cargo.toml \
            --output-dir . \
            --target aarch64-apple-darwin

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-macos-arm64
          path: ./*.node
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [validate-release, verify-publish-manifest, build-native-linux, verify-native-linux, build-native-macos]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: ./

      - name: List native binaries
        working-directory: .
        run: |
          echo "=== Native binaries ==="
          ls -lh *.node
          echo ""
          echo "Expected 3 binaries (darwin-arm64, linux-arm64, linux-x64)"

      - name: Move artifacts to platform packages
        working-directory: .
        # napi v3 defaults `artifacts` to read from ./artifacts/, but we
        # download the binaries straight into ./ above.
        # `-d .` points it at the current directory (matches --output-dir .
        # used in the build step).
        run: npx napi artifacts -d .

      - name: List platform packages
        working-directory: .
        run: |
          echo "=== Platform packages ==="
          for manifest in npm/*/package.json; do
            dir=${manifest%/package.json}
            echo "$dir:"
            ls -lh "$dir"
          done

      - name: Build TypeScript
        working-directory: .
        run: npx tsc

      - name: Verify exports paths exist
        working-directory: .
        # Guard against the class of bug where package.json#exports
        # references a file `tsc` never produces (e.g., a missing native
        # loader). Without this check, `npm publish` happily ships a
        # tarball whose entry points 404, and every downstream
        # `import` blows up with ERR_MODULE_NOT_FOUND.
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");
            const path = require("path");
            const missing = [];
            const visit = (val) => {
              if (typeof val === "string") {
                if (val.startsWith("./") && !fs.existsSync(path.resolve(val))) {
                  missing.push(val);
                }
              } else if (val && typeof val === "object") {
                for (const v of Object.values(val)) visit(v);
              }
            };
            visit(pkg.exports);
            visit(pkg.main);
            visit(pkg.types);
            if (missing.length) {
              console.error("Missing files referenced by package.json:");
              for (const m of missing) console.error("  " + m);
              process.exit(1);
            }
            console.log("All exports paths resolve.");
          '

      - name: Get SDK version
        id: version
        working-directory: .
        run: |
          VERSION=${{ needs.validate-release.outputs.version }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if printf '%s\n' "$VERSION" | grep -q -- '-'; then
            echo "dist_tag=next" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish platform packages
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for manifest in npm/*/package.json; do
            dir=${manifest%/package.json}
            pkg_name=$(node -p "require('./${manifest}').name")
            if npm view "${pkg_name}@${NPM_VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${NPM_VERSION}; it is already published."
              continue
            fi
            echo "Publishing ${pkg_name}@${NPM_VERSION} with dist-tag ${NPM_DIST_TAG}..."
            (cd "$dir" && npm publish --access public --tag "$NPM_DIST_TAG")
          done

      - name: Publish main package
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NPM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          if npm view "${pkg_name}@${NPM_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${pkg_name}@${NPM_VERSION}; it is already published."
            exit 0
          fi
          npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Output release summary
        working-directory: .
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`@agnt5/sdk\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**npm dist-tag:** \`${{ steps.version.outputs.dist_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform packages" >> $GITHUB_STEP_SUMMARY
          for manifest in npm/*/package.json; do
            pkg_name=$(node -p "require('./${manifest}').name")
            echo "- \`${pkg_name}\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Post to Slack channel
        if: always() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ job.status == 'success' && '✓' || '✗' }} @agnt5/sdk:${{ steps.version.outputs.version }}${{ job.status != 'success' && format(' - {0}', job.status) || '' }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
