name: SDK TypeScript CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental compiles, and nothing in CI reads
  # debug info. Both settings make the dev build smaller and cacheable.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  validate-pr:
    name: Validate pull request
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Rust toolchain
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
          else
            rustup default stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure compiler cache backend
        # The GitHub Actions cache is scoped per branch, so every pull request
        # starts cold. A Cloudflare R2 bucket (S3-compatible) is shared across
        # all branches. Fall back to the Actions cache when the bucket is not
        # configured, for example on pull requests from forks.
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            {
              echo "SCCACHE_BUCKET=$R2_BUCKET"
              echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              echo "SCCACHE_REGION=auto"
              echo "SCCACHE_S3_KEY_PREFIX=sdk-typescript/${RUNNER_OS}-${RUNNER_ARCH}"
              echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            } >> "$GITHUB_ENV"
            echo "Compiler cache: R2 bucket $R2_BUCKET"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Compiler cache: GitHub Actions cache (R2 not configured)"
          fi

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure build parallelism
        run: echo "CARGO_BUILD_JOBS=$(nproc 2>/dev/null || echo 4)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release workflow
        run: npm run verify:release-workflow

      - name: Verify publish manifest
        run: npm run verify:publish-manifest

      - name: Build TypeScript
        run: npm run build:ts

      - name: Check native Rust module
        run: cargo check --manifest-path native/Cargo.toml --locked

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
